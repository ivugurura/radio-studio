# Streaming-safe reverse-proxy config for the Studio /listen route.
#
# The default Nginx proxy settings BREAK an infinite audio stream: response
# buffering holds bytes back, and proxy_*_timeout kills a connection that has no
# "activity" by Nginx's definition. Include this inside the server {} block that
# fronts radio-studio, and raise the worker limits in the main nginx.conf
# (see the bottom of this file).
#
#   server {
#       listen 443 ssl;
#       server_name stream.example.org;
#       ...
#       include /etc/nginx/snippets/radio-listen.conf;   # this file
#   }

server {
    listen 443 ssl http2;
    # ...

    root <PROJECT DIR>/ui/build;
    index index.html;

    client_max_body_size 200m;
    client_body_buffer_size 512k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json image/svg+xml;

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static frontend assets
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Static files (served directly by nginx)
    location /static/ {
        alias <PROJECT DIR>/api/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django API and GraphQL
    location /api/ {
        proxy_pass http://control_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://control_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 3600s;
    }

    location /graphql {
        proxy_pass http://control_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Large upload chunk endpoint
    location /api/uploads/ {
        proxy_pass http://control_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Go streaming engine
    location ~ ^/studios/[^/]+/live$ {
        return 404;
    }

    location ~ ^/studios/[^/]+/listen$ {
        proxy_pass http://radio_studio;
        proxy_http_version 1.1;

        # Do not buffer or cache an endless stream.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nodelay on;
        gzip off;

        # A listener connection is long-lived and one-directional (server -> client).
        # Give it hours, not the default 60s.
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        proxy_connect_timeout 5s;

        # Pass the real client IP through; HandleListen reads X-Forwarded-For.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~ ^/studios/[^/]+/(status|snapshot|now|health|skip)$ {
        proxy_pass http://radio_studio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }
    # ... certificate and SSL configuration would go here.
}


# ---------------------------------------------------------------------------
# In the MAIN nginx.conf (not this snippet), for a high-concurrency listen test:
#
#   worker_processes auto;
#   worker_rlimit_nofile 262144;
#   events {
#       worker_connections 65536;   # per worker; total ceiling = this * workers
#   }
#
# Each listener behind Nginx uses ~2 FDs (client socket + upstream socket), so
# plan worker_connections * worker_processes >= 2 * target_listeners + headroom.
# Also raise the systemd LimitNOFILE for the nginx unit to match.
# ---------------------------------------------------------------------------
