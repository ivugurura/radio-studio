name: Studio Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  deploy:
    name: Deploy Studio
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref_type == 'branch'

    steps:
      - name: Deploy over SSH (server-side build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            REPO_DIR="${DEPLOY_PATH:-/srv/apps/radio-studio}"
            BRANCH="${DEPLOY_BRANCH:main}"
            SERVICE_NAME="${SERVICE_NAME:-radio-studio}"

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Missing git repository at $REPO_DIR"
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            go mod download
            mkdir -p bin
            go build -o bin/radio-studio ./cmd/server

            sudo systemctl restart "$SERVICE_NAME"
            sudo systemctl is-active --quiet "$SERVICE_NAME"
